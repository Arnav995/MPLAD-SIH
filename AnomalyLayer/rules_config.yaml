    - "ta. deoli"
    - "amravati district"
    - "dist. amravati"
    - "at various places under"
    - "at various places"
    - "erection of a meeting pavilion on municipal corporation land at"
    - "erection of a meeting pavilion on the municipal corporation's land at"
    - "construction of a library building on municipal corporation land at"
    - "construction of a library on municipal corporation land at"
    - "construction of a bus stop at"
    - "construction of a bus stop near"
    - "upgradation of toilets and related works in"
    - "laying of drainage lines"

# ==============================================================================
# Layer 2: Cost Anomaly Normalization & Parity Framework (Workstream 2 Hook)
# ==============================================================================
layer2_cost_normalization:
  enabled: false  # DORMANT: Kept disabled until official MoSPI WPI / State PWD DSR gazettes are verified
  status: "ASSUMED — UNVERIFIED, needs sourcing"
  base_fy: "2024-25"

  # Safety bounds to prevent runaway deflation from laundering tail-end overpricing
  min_deflator_multiplier: 0.70
  max_deflator_multiplier: 1.50

  # Neutral baseline multipliers (1.000). To be updated ONLY when specific
  # MoSPI / DPIIT WPI series or State PWD DSR documents are opened and cited.
  inflation_indices:
    "2024-25": 1.000
    "2025-26": 1.000  # UNVERIFIED
    "2026-27": 1.000  # UNVERIFIED

  # Geographic cost indices keyed by implementing authority (IDA_NAME).
  # Note: Ramtek (SC) constituency operates under NAGPUR_IDA (District Collector Nagpur).
  geographic_cost_indices:
    "PUNE(DISTRICT COLLECTOR PUNE_IDA)": 1.000      # UNVERIFIED
    "NAGPUR(DISTRICT COLLECTOR NAGPUR_IDA)": 1.000  # UNVERIFIED (covers Nagpur and Ramtek)
    "WARDHA(DISTRICT COLLECTOR WARDHA_IDA)": 1.000  # UNVERIFIED
    "AMRAVATI(DISTRICT COLLECTOR AMRAVATI_IDA)": 1.000 # UNVERIFIED
    "DEFAULT": 1.000
  # Physical scale quantity ceilings to prevent runaway regex matches from laundering overpricing
  scale_quantity_ceilings:
    benches: 500
    computers: 100
    borewells: 10


